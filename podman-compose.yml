version: "3.9"

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: client
    ports:
      - "8000:8000"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: scheduler
    depends_on:
      - client
    environment:
      - TARGET_URL=http://client:8000/health
    ports:
      - "9000:9000"
